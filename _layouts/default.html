<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="wrapper">
    <header>
      <h1>{{ site.title }}</h1>

      <p>
        <a href="{{ site.github.repository_url }}">
          View the Project on GitHub
          <small>{{ site.github.repository_nwo }}</small>
        </a>
      </p>

      <!-- ✅ IMAGE INSERTED HERE -->
      <div style="text-align:center; margin:20px 0;">
        <img src="{{ '/assets/my_pictures.jpeg' | relative_url }}"
             alt="Patrick Filima"
             style="width:140px; border-radius:50%;">
      </div>

    </header>

    <section>
      {{ content }}
    </section>

    <footer>
      <p>
        This project is maintained by
        <a href="{{ site.github.owner_url }}">
          {{ site.github.owner_name }}
        </a>
      </p>

      <p>
        <small>Hosted on GitHub Pages — Theme by orderedlist</small>
      </p>
    </footer>
  </div>
</body>
</html>
